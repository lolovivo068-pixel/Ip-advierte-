
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IP & Device Checker</title>
<style>
body {
  background:#101827;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
  padding:35px 15px;
}
.card {
  max-width:420px;
  margin:auto;
  padding:25px;
  background:#1e293b;
  border-radius:18px;
}
button {
  background:#2563eb;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:9px;
  cursor:pointer;
}
#results {
  text-align:left;
  margin-top:20px;
  overflow-wrap:anywhere;
}
</style>
</head>
<body>
<div class="card">
  <h1>IP Checker</h1>
  <p>Check your public IP and device information.</p>
  <p>Your information will only be shared if you agree.</p>
  <button onclick="checkIP()">I Agree & Check</button>
  <div id="results"></div>
</div>

<script>
async function checkIP() {
  const box = document.getElementById("results");
  box.textContent = "Loading...";

  try {
    const response = await fetch(
      "https://ipapi.co/json/"
    );
    if (!response.ok) throw new Error("Request failed");

    const data = await response.json();
    const ua = navigator.userAgent;

    const info = {
      IP: data.ip,
      Country: data.country_name,
      City: data.city,
      ISP: data.org,
      Device: /Mobi|Android|iPhone/i.test(ua)
        ? "Mobile" : "Desktop",
      Browser: ua,
      OperatingSystem: navigator.platform
    };

    box.replaceChildren();
    Object.entries(info).forEach(([key,value]) => {
      const p = document.createElement("p");
      p.textContent = key + ": " + (value || "Unknown");
      box.appendChild(p);
    });
  } catch (error) {
    box.textContent = "Unable to retrieve information.";
  }
}
</script>
</body>
</html>
